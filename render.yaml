services:
  - type: web
    name: ai-agent-backend
    runtime: python
    rootDir: Project1
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
    healthCheckPath: /api/health
