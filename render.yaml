services:
  - type: web
    name: ai-agent-backend
    runtime: python
    rootDir: Project1
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: AGENT_TIMEOUT
        value: "120"
    healthCheckPath: /api/health
